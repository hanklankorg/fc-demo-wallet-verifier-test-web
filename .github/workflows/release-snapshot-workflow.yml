# Release Snapshot Workflow
#
# A development snapshot of a branch: Forge CI's snapshot orchestrator packs
# the application, builds the container image from the source and publishes
# the image to ghcr.io under a tag ending in -snapshot, without a release, a
# tag or a change to the branch. The image is unsigned and carries no
# provenance.
#
# Triggers:
# - Manual workflow dispatch, on the branch to snapshot

name: Release Snapshot Workflow
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: snapshot-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  snapshot-release:
    permissions:
      actions: read # Read the run's artifacts
      contents: read # Read code for building
      packages: write # Push snapshot images to ghcr.io
    uses: hanklankorg/fc-forge-ci/.github/workflows/release-snapshot-orchestrator.yml@d33ea2bd2260bad172b2af3a79d2a2f066dfc293 # v0.90.0
    with:
      branch: ${{ github.ref_name }}
      # The full commit the workflow ref above names; the snapshot route runs
      # the CLI built in this run from exactly this commit.
      forge-ci-binary-ref: d33ea2bd2260bad172b2af3a79d2a2f066dfc293
      # Pinned by digest and admitted before any job runs; replace FIXME with
      # the digests of the release you call (docs/runtime-images.md).
      runtime-image: ghcr.io/hanklankorg/fc-forge-ci/forge-ci-runtime-base@sha256:9864c261c1b2f71d46eac2520f2e66de6b1ceb03c50f8d91acd19ddbccdd53e8 # FIXME v0.90.0 digest
      canonical-builder-image: ghcr.io/hanklankorg/fc-forge-ci/forge-ci-runtime-go-1.27@sha256:d617197ad72db4c7a40e8d9727bcef523218b13b1f59c85b046aa5d9bb60d2e5 # FIXME v0.90.0 digest
      runtime-image-full: ghcr.io/hanklankorg/fc-forge-ci/forge-ci-runtime@sha256:3dd6b0fc992f5914f529a8849f5a10a9fd81e2cdd6fc82d7ee6c2dc941c9b6f4 # FIXME v0.90.0 digest
      runtime-image-node: ghcr.io/hanklankorg/fc-forge-ci/forge-ci-runtime-node-24@sha256:269f30d41008c2fb96c8b070f04b1f401c54b56ee98344efb9a9b820ee9ef699 # FIXME v0.90.0 digest
      # The service ships as an image only: its package.json is private and
      # its declaration names no package destination.
      publish-npm: false
      enforce-vulnerabilities: false
      enforce-application-tests: false
